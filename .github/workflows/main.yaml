name: Production Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release (Production)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release --branches prod

      - name: Patch CHANGELOG.md with -prod suffix
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Get version like 1.1.8
          VERSION=$(node -p "require('./package.json').version")
          PROD_VERSION="${VERSION}-prod"

          # Escape dots in version for sed
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')

          # Match line like: 1.1.8 (2025-04-09) and replace with 1.1.8-prod (2025-04-09)
          sed -i -E "0,/^${ESCAPED_VERSION} \(([0-9]{4}-[0-9]{2}-[0-9]{2})\)/s//${PROD_VERSION} (\1)/" CHANGELOG.md

          # Show the result for debug
          echo "🔍 Updated CHANGELOG.md:"
          head -n 10 CHANGELOG.md

          # Commit and push if modified
          if git diff --quiet CHANGELOG.md; then
            echo "✅ No changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): add -prod to version ${PROD_VERSION} [skip ci]"
            git push
          fi


