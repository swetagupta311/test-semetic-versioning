name: Development Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release (Production)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release --branches prod
          NEW_VERSION=$(node -p "require('./package.json').version")
          PROD_VERSION="${NEW_VERSION}-prod"
          npm version "${PROD_VERSION}" --no-git-tag-version
          echo "PROD_VERSION=${PROD_VERSION}" >> $GITHUB_ENV
          echo "Released prod version: ${PROD_VERSION}"

      - name: Tag Dev Release
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "v${PROD_VERSION}" -m "Prod Release ${PROD_VERSION}"
          git push origin "v${PROD_VERSION}"