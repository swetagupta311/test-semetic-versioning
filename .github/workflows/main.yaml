name: Production Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release (Production)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release --branches prod

      - name: Add -prod suffix to changelog version
        run: |
          sed -i 's/^\([0-9]\+\.[0-9]\+\.[0-9]\+\) /\1-prod /' CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(changelog): append -prod suffix to versions [skip ci]"
          git push
