name: Production Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release (Production)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release --branches prod

      - name: Append -prod to CHANGELOG version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          VERSION=$(node -p "require('./package.json').version")
          PROD_VERSION="${VERSION}-prod"

          sed -i -E "s/^(${VERSION//./\\.}) (\([0-9]{4}-[0-9]{2}-[0-9]{2}\))\$/${PROD_VERSION} \2/" CHANGELOG.md

          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): append -prod suffix to version ${PROD_VERSION} [skip ci]"
            git push
          fi


