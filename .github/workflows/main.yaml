name: Release and Deployment

on:
  push:
    branches: [uat]  
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest    
    steps:
      - run: echo "✅ Unified changelog triggered from ${{ github.event.client_payload.source }}"

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release --branches uat
      # - name: Trigger Unified Changelog Update on prod
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #     curl -X POST \
      #       -H "Accept: application/vnd.github+json" \
      #       -H "Authorization: token $GH_TOKEN" \
      #       https://api.github.com/repos/swetagupta311/test-semetic-versioning/dispatches \
      #       -d '{"event_type":"update-unified-changelog", "client_payload": { "source": "uat" }}' \

      - name: Trigger Unified Changelog Update on prod
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"update-unified-changelog", "client_payload": {"source": "uat"}}'