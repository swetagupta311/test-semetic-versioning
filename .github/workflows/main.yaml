name: Production Release  # Changed from "Development Release" to match branch

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Semantic Release (Production)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Force the version format with branch name
          echo "Configuring version format..."
          echo "version=1.1.2-prod" >> $GITHUB_OUTPUT
          npx semantic-release --branches prod
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "PROD_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "Released prod version: ${NEW_VERSION}"

      - name: Update Changelog with Branch Name
        run: |
          # Modify the changelog to include branch name
          sed -i "s/^## \[\([0-9]\+\.[0-9]\+\.[0-9]\+\)\]/## [\1-prod]/g" CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore: update changelog with branch suffix" || echo "No changelog changes to commit"

      - name: Tag Release
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "v${PROD_VERSION}-prod" -m "Prod Release ${PROD_VERSION}-prod"
          git push origin "v${PROD_VERSION}-prod"