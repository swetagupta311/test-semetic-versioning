name: Release and Deployment
on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm uninstall semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec conventional-changelog-conventionalcommits
             npm install -D \
              semantic-release@21 \
              @semantic-release/changelog@6 \
              @semantic-release/git@10 \
              @semantic-release/exec@6 \  
              conventional-changelog-conventionalcommits@      

      - name: Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: semantic-release:*
        run: |
          npx semantic-release
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_release_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Version released: ${NEW_VERSION}"