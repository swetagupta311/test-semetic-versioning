name: Release and Deployment
on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
             npm install -D conventional-changelog-angular

      - name: Clean up tags and version files
        run: |
             git tag -l | xargs -n 1 git tag -d || true
    
             git ls-remote --tags origin | awk '{print $2}' | xargs -n 1 git push origin --delete || true
    
             echo '{"version":"1.0.0"}' > package.json
             echo "# Changelog" > CHANGELOG.md
             git add package.json CHANGELOG.md
             git commit -m "chore: reset version files" || true

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      
