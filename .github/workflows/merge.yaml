name: Unified Changelog Update

on:
  repository_dispatch:
    types: [update-unified-changelog]

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: prod

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm install -D conventional-changelog-angular

      - name: Fetch uat branch
        run: |
          git fetch origin uat:uat

      - name: Generate Unified Changelog
        run: node mergechangelog.js

      - name: Debug: View Unified Changelog
        run: cat UNIFIED_CHANGELOG.md

      - name: Commit and Push Changelog
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add UNIFIED_CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update unified changelog from uat"
          git push origin prod
